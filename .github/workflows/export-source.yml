name: Export exact source tree

on:
  push:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create source archive
        run: tar --exclude=.git -czf source-tree.tar.gz .
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: source-tree-${{ github.sha }}
          path: source-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
