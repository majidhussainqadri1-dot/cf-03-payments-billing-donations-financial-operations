name: CF-03 Round 12 Accounting Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  accounting-integrity:
    name: PHP ${{ matrix.php }} accounting integrity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax check Round 12 regression
        run: php -l tests/run-round12-accounting-integrity.php
      - name: Round 12 accounting integrity regression
        run: php tests/run-round12-accounting-integrity.php
