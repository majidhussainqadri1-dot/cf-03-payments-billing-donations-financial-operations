name: CF-03 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Foundation tests
        run: php tests/run.php
      - name: Product evidence tests
        run: php tests/run-0.2.php
      - name: Complete source-candidate tests
        run: php tests/run-1.0.php
      - name: Final donation policy tests
        run: php tests/run-free-donation-policy.php
      - name: Founder ownership and transparency tests
        run: php tests/run-founder-donation-transparency.php
      - name: Three-plan harmonization tests
        run: php tests/run-three-plan-harmonization.php
      - name: Dual-plan completion tests
        run: php tests/run-plan-completion.php
      - name: Second adversarial integrity tests
        run: php tests/run-adversarial-2.php
      - name: Forty-round regression tests
        run: php tests/run-review-40.php
      - name: Validate manifests
        run: |
          for file in manifests/*.json; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done
      - name: Prohibited credential material scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git --exclude=ci.yml .
      - name: Governing source assertions
        run: |
          grep -RInq 'SSH-FIN-DONATION-2026-08-04-01' src docs manifests README.md
          grep -RInq 'SSH-PMP-2026-v3.0' src docs manifests README.md
          grep -RInq 'Sabri Platform All-Chats Recovered Directive Register 2026 v2.0' src docs manifests README.md
          grep -RInq 'CF-03 Integrated Final Plan 2026 v2.0' src docs manifests README.md
          grep -RInq 'RCD-022' src docs manifests README.md
          grep -RInq 'superseded_conflict_resolved' src manifests
          grep -RInq 'CHAT-DL-001' src docs manifests README.md
          grep -RInq 'CHAT-QA-001' docs manifests README.md
          grep -q 'Version: 1.1.0-rc.3' cf-03-payments-billing-donations-financial-operations.php
          grep -q "SABRI_CF03_VERSION','1.1.0-rc.3'" cf-03-payments-billing-donations-financial-operations.php
          grep -q "'1.1.0-rc.3'" src/Plugin.php
          grep -RInq "public const VERSION='3.0.0'" src/Persistence/CompleteSchema.php
          grep -q 'sabri_cf03_expenses' src/Persistence/TransparencySchema.php
          grep -q 'sabri_cf03_transparency_snapshots' src/Persistence/TransparencySchema.php
          grep -q 'sabri_cf03_donor_acknowledgments' src/Persistence/TransparencySchema.php
          test -f src/Application/GoverningPlanRegistry.php
          test -f src/Domain/FinancialTransparencySnapshot.php
          test -f src/Domain/FounderOwnershipPolicy.php
          test -f src/Domain/FinancialDownloadGrant.php
          test -f src/Application/FinancialDownloadContract.php
          test -f tests/run-founder-donation-transparency.php
          test -f tests/run-three-plan-harmonization.php
          grep -q '/transparency/' src/Application/RouteCatalogue.php
          grep -q '/billing/invoices/{id}/download' src/Application/RouteCatalogue.php
          grep -q '/billing/receipts/{id}/download' src/Application/RouteCatalogue.php
          grep -q '/admin/finance/exports/{id}/download' src/Application/RouteCatalogue.php
          grep -q 'sabri_manage_finance' src/Plugin.php
          grep -q 'SHOW TABLES LIKE' src/Infrastructure/WordPressSchemaInstaller.php

  package:
    name: Deterministic package and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build twice
        run: |
          bash scripts/build-package.sh
          first="$(sha256sum build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip | cut -d' ' -f1)"
          bash scripts/build-package.sh
          second="$(sha256sum build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip | cut -d' ' -f1)"
          test "$first" = "$second"
      - name: Verify canonical package
        run: |
          test -f build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip
          unzip -Z1 build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip | awk -F/ 'NF && $1 != "cf-03-payments-billing-donations-financial-operations" { exit 1 }'
          unzip -p build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip cf-03-payments-billing-donations-financial-operations/cf-03-payments-billing-donations-financial-operations.php | grep -q 'Version: 1.1.0-rc.3'
          unzip -p build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip cf-03-payments-billing-donations-financial-operations/src/Persistence/CompleteSchema.php | grep -q "VERSION='3.0.0'"
          unzip -p build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip cf-03-payments-billing-donations-financial-operations/src/Application/FinancialDownloadContract.php | grep -q 'CHAT-DL-001'
          unzip -p build/cf-03-payments-billing-donations-financial-operations-1.1.0-rc.3.zip cf-03-payments-billing-donations-financial-operations/src/Application/GoverningPlanRegistry.php | grep -q 'RCD-022'
