name: CF-03 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Foundation tests
        run: php tests/run.php
      - name: Product evidence tests
        run: php tests/run-0.2.php
      - name: Complete source-candidate tests
        run: php tests/run-1.0.php
      - name: Final donation policy tests
        run: php tests/run-free-donation-policy.php
      - name: Founder ownership and transparency tests
        run: php tests/run-founder-donation-transparency.php
      - name: Three-plan harmonization tests
        run: php tests/run-three-plan-harmonization.php
      - name: Dual-plan completion tests
        run: php tests/run-plan-completion.php
      - name: Second adversarial integrity tests
        run: php tests/run-adversarial-2.php
      - name: Forty-round regression tests
        run: php tests/run-review-40.php
      - name: Durable runtime completion tests
        run: php tests/run-runtime-completion.php
      - name: Complete source implementation tests
        run: php tests/run-source-completion.php
      - name: Fresh adversarial source tests
        run: php tests/run-adversarial-source.php
      - name: Validate manifests
        run: |
          for file in manifests/*.json; do php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"; done
      - name: Prohibited credential material scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git --exclude=ci.yml .
      - name: Governing source and complete-runtime assertions
        run: |
          grep -RInq 'SSH-FIN-DONATION-2026-08-04-01' src docs manifests README.md
          grep -RInq 'SSH-PMP-2026-v3.0' src docs manifests README.md
          grep -RInq 'Sabri Platform All-Chats Recovered Directive Register 2026 v2.1' src docs manifests README.md
          grep -RInq 'CF-03 Integrated Final Plan 2026 v2.0' src docs manifests README.md
          grep -RInq 'RCD-022' src docs manifests README.md
          grep -RInq 'superseded_conflict_resolved' src manifests
          grep -RInq 'CHAT-DL-001' src docs manifests README.md
          grep -RInq 'CHAT-QA-001' docs manifests README.md
          grep -q 'Version: 1.2.0-rc.1' cf-03-payments-billing-donations-financial-operations.php
          grep -Eq "define\('SABRI_CF03_VERSION',[[:space:]]*'1.2.0-rc.1'\)" cf-03-payments-billing-donations-financial-operations.php
          grep -Eq "define\('SABRI_CF03_SCHEMA_VERSION',[[:space:]]*'3.2.0'\)" cf-03-payments-billing-donations-financial-operations.php
          grep -q "'1.2.0-rc.1'" src/Plugin.php
          grep -RInq "public const VERSION = RuntimeSchemaExtension::VERSION" src/Persistence/CompleteSchema.php
          grep -RInq "public const VERSION = '3.2.0'" src/Persistence/RuntimeSchemaExtension.php
          test -f src/Infrastructure/WordPressFinancialRepository.php
          test -f src/Application/DonationCheckoutService.php
          test -f src/Application/WebhookIngestionService.php
          test -f src/Application/RefundWorkflowService.php
          test -f src/Application/DonationManagementService.php
          test -f src/Application/SettlementOperationsService.php
          test -f src/Application/ExpenseTransparencyService.php
          test -f src/Application/SecureExportService.php
          test -f src/Application/FinancialAdjustmentService.php
          test -f src/Application/IncidentPathGuard.php
          test -f src/Application/RiskOperationsService.php
          test -f src/Application/RetentionOperationsService.php
          test -f src/Application/IncidentOperationsService.php
          test -f src/Application/SystemIntegrityService.php
          test -f src/Application/FinancialAuditService.php
          test -f src/Infrastructure/WordPressFinanceAdminApi.php
          test -f src/Infrastructure/WordPressPublicUi.php
          test -f src/Infrastructure/WordPressPrivacy.php
          test -f src/Domain/DonationNeutralityPolicy.php
          test -f src/Domain/FinancialDueProcessPolicy.php
          test -f src/Domain/FinancialOutcomeProjection.php
          test -f tests/run-runtime-completion.php
          test -f tests/run-source-completion.php
          test -f tests/run-adversarial-source.php
          grep -q 'sabri_import_settlements' src/Plugin.php
          grep -q 'sabri_close_finance' src/Plugin.php
          grep -q 'sabri_manage_finance_adjustments' src/Plugin.php
          grep -q 'sabri_manage_finance_incidents' src/Plugin.php
          grep -q 'SHOW COLUMNS FROM' src/Infrastructure/WordPressSchemaInstaller.php
          grep -q "UNIQUE KEY previous_hash(previous_hash)" src/Persistence/RuntimeSchemaExtension.php
          grep -q "imported_by varchar(191) NOT NULL" src/Persistence/RuntimeSchemaExtension.php

  package:
    name: Deterministic package and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build twice
        run: |
          bash scripts/build-package.sh
          first="$(sha256sum build/cf-03-payments-billing-donations-financial-operations-1.2.0-rc.1.zip | cut -d' ' -f1)"
          bash scripts/build-package.sh
          second="$(sha256sum build/cf-03-payments-billing-donations-financial-operations-1.2.0-rc.1.zip | cut -d' ' -f1)"
          test "$first" = "$second"
      - name: Verify canonical package
        run: |
          ZIP=build/cf-03-payments-billing-donations-financial-operations-1.2.0-rc.1.zip
          test -f "$ZIP"
          unzip -Z1 "$ZIP" | awk -F/ 'NF && $1 != "cf-03-payments-billing-donations-financial-operations" { exit 1 }'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/cf-03-payments-billing-donations-financial-operations.php | grep -q 'Version: 1.2.0-rc.1'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/cf-03-payments-billing-donations-financial-operations.php | grep -Eq "define\('SABRI_CF03_SCHEMA_VERSION',[[:space:]]*'3.2.0'\)"
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Persistence/RuntimeSchemaExtension.php | grep -q "VERSION = '3.2.0'"
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Application/GoverningPlanRegistry.php | grep -q 'v2.1'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Infrastructure/WordPressFinancialRepository.php | grep -q 'START TRANSACTION'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Application/SettlementOperationsService.php | grep -q 'reviewPeriod'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Application/FinancialAdjustmentService.php | grep -q 'FinancialAdjustmentExecuted'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Application/SecureExportService.php | grep -q 'FinancialDownloadGrant'
          unzip -p "$ZIP" cf-03-payments-billing-donations-financial-operations/src/Domain/DonationNeutralityPolicy.php | grep -q 'file26_ranking_must_ignore_donation'
