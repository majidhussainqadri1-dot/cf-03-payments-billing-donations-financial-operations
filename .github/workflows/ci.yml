name: CF-03 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Foundation tests
        run: php tests/run.php
      - name: Product evidence tests
        run: php tests/run-0.2.php
      - name: Complete source-candidate tests
        run: php tests/run-1.0.php
      - name: Free-platform donation policy tests
        run: php tests/run-free-donation-policy.php
      - name: Dual-plan completion tests
        run: php tests/run-plan-completion.php
      - name: Second adversarial integrity tests
        run: php tests/run-adversarial-2.php
      - name: Forty-round regression tests
        run: php tests/run-review-40.php
      - name: Validate manifests
        run: |
          for file in manifests/*.json; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done
      - name: Prohibited credential material scan
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,})' --exclude-dir=.git --exclude=ci.yml .
      - name: Governing source assertions
        run: |
          grep -RInq 'SSH-FIN-2026-08-04-01' src docs manifests README.md
          grep -q 'Version: 1.0.0-rc.3' cf-03-payments-billing-donations-financial-operations.php
          grep -q "SABRI_CF03_VERSION', '1.0.0-rc.3'" cf-03-payments-billing-donations-financial-operations.php
          grep -RInq "public const VERSION = '2.0.0'" src/Persistence/Schema.php
          test -f src/Domain/PaymentIntent.php
          test -f src/Application/ProviderWebhookVerifier.php
          test -f src/Application/ReconciliationEngine.php
          test -f src/Domain/ChargebackCase.php
          test -f src/Domain/SecureExportJob.php
          test -f src/Domain/RefundBalance.php
          test -f tests/run-review-40.php
          test -f src/Infrastructure/WordPressRestApi.php
          grep -q 'SHOW TABLES LIKE' src/Infrastructure/WordPressSchemaInstaller.php
          grep -q 'schema_incomplete_fail_closed' src/Plugin.php
          grep -q 'sabri_manage_finance' src/Plugin.php
          grep -q 'sabri_manage_finance' src/Infrastructure/WordPressRestApi.php

  package:
    name: Deterministic package and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build twice
        run: |
          bash scripts/build-package.sh
          first="$(sha256sum build/cf-03-payments-billing-donations-financial-operations-1.0.0-rc.3.zip | cut -d' ' -f1)"
          bash scripts/build-package.sh
          second="$(sha256sum build/cf-03-payments-billing-donations-financial-operations-1.0.0-rc.3.zip | cut -d' ' -f1)"
          test "$first" = "$second"
      - name: Verify canonical package
        run: |
          test -f build/cf-03-payments-billing-donations-financial-operations-1.0.0-rc.3.zip
          unzip -Z1 build/cf-03-payments-billing-donations-financial-operations-1.0.0-rc.3.zip | awk -F/ 'NF && $1 != "cf-03-payments-billing-donations-financial-operations" { exit 1 }'
          unzip -p build/cf-03-payments-billing-donations-financial-operations-1.0.0-rc.3.zip cf-03-payments-billing-donations-financial-operations/cf-03-payments-billing-donations-financial-operations.php | grep -q 'Version: 1.0.0-rc.3'
          unzip -p build/cf-03-payments-billing-donations-financial-operations-1.0.0-rc.3.zip cf-03-payments-billing-donations-financial-operations/src/Persistence/Schema.php | grep -q "VERSION = '2.0.0'"
