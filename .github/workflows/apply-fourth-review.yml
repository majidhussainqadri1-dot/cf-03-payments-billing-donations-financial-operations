name: Apply fourth review

on:
  push:
    paths:
      - '.github/workflows/apply-fourth-review.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/cf-03-foundation-0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          cat .automation/fourth-review.patch.xz.b64.part* | base64 -d | xz -d > /tmp/fourth-review.patch
          patch --batch --forward -p1 < /tmp/fourth-review.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/run-1.0.php')
          text = path.read_text()
          text = text.replace("insert('x', '1'", "insert('test_records', 'record:1'")
          text = text.replace("compareAndSwap('x', '1'", "compareAndSwap('test_records', 'record:1'")
          path.write_text(text)

          path = Path('tests/run-runtime-completion.php')
          text = path.read_text().replace("$at->modify('-30 seconds')->getTimestamp()", "$at->getTimestamp()")
          path.write_text(text)

          path = Path('docs/architecture.md')
          text = path.read_text().replace('# CF-03 Architecture — 1.2.0-rc.2', '# CF-03 Architecture — 1.2.0-rc.3')
          path.write_text(text)

          path = Path('tests/run-review-40-second.php')
          text = path.read_text()
          text = text.replace("'Version: 1.2.0-rc.2'", "'Version: 1.2.0-rc.3'")
          text = text.replace("containsR2($s,'1.2.0-rc.2')", "containsR2($s,'1.2.0-rc.3')")
          text = text.replace("'404 tests per PHP version'", "'444 tests per PHP version'")
          text = text.replace("'1,212 test executions'", "'1,332 test executions'")
          text = text.replace("'# CF-03 Architecture — 1.2.0-rc.2'", "'# CF-03 Architecture — 1.2.0-rc.3'")
          path.write_text(text)

          path = Path('tests/run-review-40-third.php')
          text = path.read_text()
          text = text.replace("containsR3($ci,'review-evidence-40-rounds-third-1.2.0-rc.2.md')", "containsR3($ci,'run-review-40-fourth.php')")
          text = text.replace("containsR3($m,'1.2.0-rc.2')", "containsR3($m,'1.2.0-rc.3')")
          path.write_text(text)

          path = Path('tests/run-review-40-fourth.php')
          text = path.read_text().replace("before4($s,\"'state' => 'provider_pending'\",'$provider->refund(')", "before4($s,\"'state'] = 'provider_pending'\",'$provider->refund(')")
          path.write_text(text)
          PY
          rm -rf .automation
          rm -f .github/workflows/apply-fourth-review.yml .github/workflows/export-source.yml
      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Full regression matrix
        run: |
          php tests/run.php
          php tests/run-0.2.php
          php tests/run-1.0.php
          php tests/run-free-donation-policy.php
          php tests/run-founder-donation-transparency.php
          php tests/run-three-plan-harmonization.php
          php tests/run-plan-completion.php
          php tests/run-adversarial-2.php
          php tests/run-review-40.php
          php tests/run-runtime-completion.php
          php tests/run-source-completion.php
          php tests/run-adversarial-source.php
          php tests/run-review-40-second.php
          php tests/run-review-40-third.php
          php tests/run-review-40-fourth.php
      - name: Validate manifests
        run: |
          for file in manifests/*.json; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done
      - name: Deterministic package smoke build
        run: bash scripts/build-package.sh
      - name: Commit corrected candidate
        run: |
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'fix: complete fourth forty-round financial hardening review'
          git push origin "HEAD:${GITHUB_REF_NAME}"
